name: Build Windows exe

# VERSION 파일의 버전 번호를 바꿔서 올리면 (또는 Actions 탭에서 직접 실행하면)
# Windows용 exe를 만들어 Releases 페이지에 v<버전> 으로 올립니다.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --clean
          --name "EVE-Tracking-Meter"
          --icon icons/tracking_meter.ico
          eve_tracking_meter.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Tracking-Meter
          path: dist/EVE-Tracking-Meter.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: EVE Tracking Meter v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/EVE-Tracking-Meter.exe
          generate_release_notes: true
