name: Build Windows exe

# 버전 태그(v1.0.0 등)를 올리거나 Actions 탭에서 직접 실행하면
# Windows용 exe를 만들어 Releases 페이지에 올립니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --clean
          --name "EVE-Tracking-Meter"
          --icon icons/tracking_meter.ico
          eve_tracking_meter.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Tracking-Meter
          path: dist/EVE-Tracking-Meter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EVE-Tracking-Meter.exe
          generate_release_notes: true
